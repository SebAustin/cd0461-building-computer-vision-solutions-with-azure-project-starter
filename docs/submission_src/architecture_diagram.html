<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Azure Services Architecture</title>
<link rel="stylesheet" href="style.css">
<style>
  @page { size: Letter landscape; margin: 0.4in; }
  rect { rx: 6; }
  .in   { fill: #eef3f9; stroke: #6d87a8; }
  .ai   { fill: #ffffff; stroke: #0b5cad; stroke-width: 1.8; }
  .app  { fill: #e9f6ee; stroke: #1d7a46; stroke-width: 1.8; }
  .data { fill: #fff6e5; stroke: #b9770e; stroke-width: 1.4; }
  .zone { fill: none; stroke: #9aa6b8; stroke-dasharray: 5 4; }
  .t  { font-size: 12.5px; fill: #1d2433; font-weight: 600; text-anchor: middle; }
  .s  { font-size: 10px; fill: #5b6475; text-anchor: middle; }
  .z  { font-size: 10.5px; fill: #5b6475; font-weight: 600; letter-spacing: .06em; }
  .a  { stroke: #4a5568; stroke-width: 1.4; fill: none; marker-end: url(#arr); }
  .ab { stroke: #b9770e; stroke-width: 1.2; fill: none; stroke-dasharray: 3 3; marker-end: url(#arrb); }
</style>
</head>
<body>
<h1>Azure Services Architecture</h1>
<div class="sub">Which Azure service processes which input, and how results reach the kiosk</div>
<figure>
<svg viewBox="0 0 1000 540" width="100%" role="img" aria-label="Azure architecture of the boarding kiosk">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b9770e"/></marker>
  </defs>

  <!-- zones -->
  <rect class="zone" x="200" y="22" width="410" height="420"/><text class="z" x="212" y="40">AZURE AI SERVICES</text>
  <rect class="zone" x="640" y="22" width="345" height="300"/><text class="z" x="652" y="40">KIOSK APPLICATION (Python, kiosk/ package)</text>

  <!-- inputs -->
  <rect class="in" x="10" y="55"  width="160" height="44"/><text class="t" x="90" y="74">Digital ID</text><text class="s" x="90" y="89">PNG</text>
  <rect class="in" x="10" y="125" width="160" height="44"/><text class="t" x="90" y="144">Boarding pass</text><text class="s" x="90" y="159">PDF</text>
  <rect class="in" x="10" y="235" width="160" height="44"/><text class="t" x="90" y="254">Identity video</text><text class="s" x="90" y="269">MP4, uploaded from local disk</text>
  <rect class="in" x="10" y="365" width="160" height="44"/><text class="t" x="90" y="384">Luggage images</text><text class="s" x="90" y="399">JPG test set</text>

  <!-- AI services -->
  <rect class="ai" x="225" y="55" width="360" height="114"/>
  <text class="t" x="405" y="76">Azure AI Document Intelligence</text>
  <text class="s" x="405" y="91">(formerly Form Recognizer)</text>
  <rect class="ai" x="240" y="100" width="160" height="56"/><text class="t" x="320" y="122">prebuilt-idDocument</text><text class="s" x="320" y="138">name, DoB, sex</text>
  <rect class="ai" x="410" y="100" width="160" height="56"/><text class="t" x="490" y="122">Custom template model</text><text class="s" x="490" y="138">boarding-pass-v1, 10 fields</text>

  <rect class="ai" x="225" y="200" width="170" height="80"/><text class="t" x="310" y="224">Azure AI Video Indexer</text><text class="s" x="310" y="239">(successor of Video Analyzer)</text><text class="s" x="310" y="255">faces, thumbnails,</text><text class="s" x="310" y="269">emotions, sentiment</text>
  <rect class="ai" x="415" y="200" width="170" height="80"/><text class="t" x="500" y="224">Azure AI Face</text><text class="s" x="500" y="240">detect ID face</text><text class="s" x="500" y="254">person group from video frames</text><text class="s" x="500" y="268">identify + verify → confidence</text>

  <rect class="ai" x="225" y="345" width="360" height="80"/><text class="t" x="405" y="368">Azure AI Custom Vision</text><text class="s" x="405" y="384">object detection project "lighter-detection", tag "lighter"</text><text class="s" x="405" y="399">trained on 45 images / 60 boxes → published prediction endpoint</text><text class="s" x="405" y="413">returns lighter probability per image</text>

  <!-- app -->
  <rect class="app" x="660" y="55" width="150" height="56"/><text class="t" x="735" y="78">Extraction parsers</text><text class="s" x="735" y="94">raw JSON → models</text>
  <rect class="app" x="660" y="140" width="150" height="56"/><text class="t" x="735" y="163">Manifest lookup</text><text class="s" x="735" y="179">by ticket number</text>
  <rect class="app" x="830" y="55" width="140" height="141"/><text class="t" x="900" y="80">Validators</text><text class="s" x="900" y="100">Name · DoB</text><text class="s" x="900" y="116">Boarding pass</text><text class="s" x="900" y="132">Person ≥ 0.65</text><text class="s" x="900" y="148">Luggage &lt; 0.5</text>
  <rect class="app" x="660" y="230" width="310" height="70"/><text class="t" x="815" y="255">Kiosk message + manifest update</text><text class="s" x="815" y="272">board / ID mismatch / pass mismatch / see agent</text><text class="s" x="815" y="287">TRUE/FALSE written to FlightManifest_final.csv</text>

  <!-- storage -->
  <rect class="data" x="640" y="350" width="345" height="170"/>
  <text class="t" x="812" y="372">Azure Blob Storage</text>
  <text class="s" x="812" y="392">manifest · digital-ids · boarding-passes · identity-videos</text>
  <text class="s" x="812" y="408">training-boarding-passes (PDF + .labels.json + .ocr.json + fields.json)</text>
  <text class="s" x="812" y="424">luggage-scans · kiosk-results (per-passenger JSON, feedback)</text>
  <text class="s" x="812" y="452">Video Indexer has its own storage account (managed identity)</text>
  <text class="s" x="812" y="490">Monitoring: Azure Monitor metrics per resource</text>
  <text class="s" x="812" y="506">(calls, latency, errors) → service consumption report</text>

  <!-- arrows inputs -> services -->
  <path class="a" d="M170,77 H210 V128 H240"/>
  <path class="a" d="M170,147 H200 V150 H410"/>
  <path class="a" d="M170,257 H225"/>
  <path class="a" d="M170,77 H205 V240 H415"/>
  <path class="a" d="M395,262 H415"/>
  <path class="a" d="M170,387 H225"/>

  <!-- services -> app -->
  <path class="a" d="M585,112 H660"/>
  <path class="a" d="M585,240 H620 V88 H660"/>
  <path class="a" d="M585,385 H625 V102 H660"/>
  <path class="a" d="M735,111 V140"/>
  <path class="a" d="M810,168 H830"/>
  <path class="a" d="M810,83 H830"/>
  <path class="a" d="M900,196 V230"/>

  <!-- storage links -->
  <path class="ab" d="M815,300 V350"/>
  <path class="ab" d="M640,470 H310 V425"/>
  <path class="ab" d="M640,450 C520,450 470,200 490,169"/>
</svg>
<figcaption>Document Intelligence reads the ID and boarding pass. Video Indexer finds the faces in the identity video, and their thumbnails train a
Face person group that is matched against the ID face. Custom Vision scores the luggage images for lighters. The Python kiosk
application looks the passenger up by ticket number, runs the five validations, shows the message and writes the result to Blob Storage.
Dashed lines are storage traffic: training data for the custom models, and results written back.</figcaption>
</figure>
</body>
</html>
